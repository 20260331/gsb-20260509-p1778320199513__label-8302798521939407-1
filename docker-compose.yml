services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: excel-function-helper
    ports:
      - "8888:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
